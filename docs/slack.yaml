display_information:
  name: error-alert
  description: 에러 알림 · 통계 대시보드 봇
  background_color: "#800000"

features:
  bot_user:
    display_name: error-alert
    always_online: true
  slash_commands:
    - command: /errors
      description: 에러 목록 조회 (미해결 / 날짜 / 시간 범위)
      usage_hint: "[all] [YYYY-MM-DD | 시작 YYYY-MM-DDTHH:MM 끝 YYYY-MM-DDTHH:MM] [limit=N]"
      should_escape: false

oauth_config:
  scopes:
    bot:
      - chat:write        # 에러/대시보드/다이제스트 메시지 발송·수정
      - pins:write         # 대시보드 메시지 고정
      - incoming-webhook   # Airflow 폴백 경로용 (airflow_connection.md 참고)
      - commands            # /errors 슬래시 커맨드 수신

settings:
  interactivity:
    is_enabled: true       # Socket Mode로 받으므로 request_url은 비워둠
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
